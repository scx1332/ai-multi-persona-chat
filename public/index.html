<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ollamachat</title>
<style>
  :root {
    --bg: #101418; --panel: #171d24; --panel2: #1e262f; --border: #2a3540;
    --text: #dde5ec; --dim: #8494a3; --accent: #4da3ff; --user: #24405c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }

  #sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 16px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  #new-chat { margin: 12px 16px; padding: 8px; background: var(--accent); color: #06121f; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
  #chat-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  .chat-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
  .chat-item:hover { background: var(--panel2); }
  .chat-item.active { background: var(--panel2); outline: 1px solid var(--border); }
  .chat-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .persona { font-size: 11px; color: var(--dim); }
  .chat-item .del { color: var(--dim); background: none; border: 0; cursor: pointer; }
  .chat-item .del:hover { color: #ff7b7b; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* new chat setup panel */
  #setup { max-width: 640px; margin: 40px auto; padding: 0 20px; width: 100%; }
  #setup label { display: block; margin: 14px 0 4px; color: var(--dim); font-size: 13px; }
  #setup select, #setup textarea, #setup input {
    width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font: inherit;
  }
  #setup textarea { min-height: 120px; resize: vertical; }
  #setup .row { display: flex; gap: 10px; margin-top: 18px; }
  #setup button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); cursor: pointer; }
  #setup button.primary { background: var(--accent); color: #06121f; border: 0; font-weight: 600; }

  /* chat view */
  #chat-header { padding: 8px 20px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--dim); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #chat-header select { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 13px; max-width: 220px; }
  #chat-header label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #sys-details { flex-basis: 100%; }
  #sys-details summary { cursor: pointer; user-select: none; }
  #sys-details textarea { width: 100%; min-height: 80px; margin: 6px 0; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font: inherit; resize: vertical; }
  #sys-details button { padding: 4px 12px; border-radius: 6px; border: 0; background: var(--accent); color: #06121f; font-weight: 600; cursor: pointer; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 780px; margin: 0 auto 16px; }
  .msg .who { font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  .msg .bubble { padding: 10px 14px; border-radius: 10px; background: var(--panel2); white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .bubble { background: var(--user); }
  details.think { margin: 0 0 6px; font-size: 13px; }
  details.think summary { color: var(--dim); cursor: pointer; user-select: none; }
  details.think .tbody { color: var(--dim); border-left: 2px solid var(--border); padding: 4px 10px; margin-top: 4px; white-space: pre-wrap; font-style: italic; }
  #composer { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); max-width: 820px; margin: 0 auto; width: 100%; }
  #composer textarea { flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font: inherit; resize: none; height: 44px; }
  #composer button { padding: 0 18px; border-radius: 8px; border: 0; background: var(--accent); color: #06121f; font-weight: 600; cursor: pointer; }
  #composer button:disabled { opacity: .5; cursor: default; }
  .error { color: #ff7b7b; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="sidebar">
  <h1>ollamachat</h1>
  <button id="new-chat">+ New chat</button>
  <div id="chat-list"></div>
</div>

<div id="main">
  <div id="setup">
    <h2>New chat</h2>
    <label>Model</label>
    <select id="model"></select>
    <label>Persona</label>
    <select id="persona"></select>
    <label>System prompt (edit freely — this exact text is sent as the system message)</label>
    <textarea id="sysprompt"></textarea>
    <label>API mode</label>
    <select id="mode">
      <option value="chat" selected>chat — Ollama chat API, reliable thinking (no tools ever passed)</option>
      <option value="raw">raw — raw token API, prompt assembled by this app (thinking model-dependent)</option>
    </select>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
      <input type="checkbox" id="think" checked style="width:auto"> Thinking (reasoning models: qwen3, deepseek-r1, …)
    </label>
    <label>Save edited prompt as persona (optional name)</label>
    <input id="persona-name" placeholder="e.g. Pirate Poet">
    <div class="row">
      <button class="primary" id="start-chat">Start chat</button>
      <button id="save-persona">Save persona</button>
      <button id="delete-persona">Delete selected persona</button>
    </div>
    <p id="setup-msg" class="error"></p>
  </div>

  <div id="chat-view" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div id="chat-header">
      <select id="chat-model" title="Model"></select>
      <select id="chat-persona" title="Persona"></select>
      <label title="Reasoning on/off"><input type="checkbox" id="chat-think" style="width:auto"> think</label>
      <details id="sys-details">
        <summary>system prompt</summary>
        <textarea id="chat-sysprompt"></textarea>
        <button id="chat-sys-save">Save</button>
      </details>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <textarea id="input" placeholder="Say something… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let personas = [], models = [], currentChat = null, streaming = false;

const api = async (path, opts) => {
  const r = await fetch(path, opts && { ...opts, headers: { "content-type": "application/json" } });
  return r.json();
};

async function loadPersonas() {
  personas = await api("/api/personas");
  const sel = $("persona");
  sel.innerHTML = personas.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  sel.onchange = () => {
    const p = personas.find(x => x.id == sel.value);
    if (p) { $("sysprompt").value = p.system_prompt; $("persona-name").value = p.name; }
  };
  sel.onchange();
}

async function loadModels() {
  ({ models } = await api("/api/models"));
  $("model").innerHTML = models.length
    ? models.map(m => `<option>${esc(m)}</option>`).join("")
    : `<option value="">(no models — run: ollama pull qwen3:0.6b)</option>`;
}

async function loadChats() {
  const chats = await api("/api/chats");
  $("chat-list").innerHTML = chats.map(c => `
    <div class="chat-item ${currentChat?.id === c.id ? "active" : ""}" data-id="${c.id}">
      <span class="title">${esc(c.title)}</span>
      <span class="persona">${esc(c.persona_name ?? "")}</span>
      <button class="del" data-del="${c.id}" title="Delete">×</button>
    </div>`).join("");
  document.querySelectorAll(".chat-item").forEach(el => {
    el.onclick = (e) => {
      if (e.target.dataset.del) return;
      openChat(Number(el.dataset.id));
    };
  });
  document.querySelectorAll(".del").forEach(el => {
    el.onclick = async () => {
      await fetch(`/api/chats/${el.dataset.del}`, { method: "DELETE" });
      if (currentChat?.id == el.dataset.del) showSetup();
      loadChats();
    };
  });
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function showSetup() {
  currentChat = null;
  $("setup").classList.remove("hidden");
  $("chat-view").classList.add("hidden");
  loadChats();
}

function renderMessage(role, content, thinking) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  let inner = `<div class="who">${role === "user" ? "you" : "assistant"}</div>`;
  if (thinking) {
    inner += `<details class="think"><summary>thinking</summary><div class="tbody">${esc(thinking)}</div></details>`;
  }
  inner += `<div class="bubble">${esc(content)}</div>`;
  div.innerHTML = inner;
  $("messages").appendChild(div);
  return div;
}

function syncHeader() {
  $("chat-model").innerHTML = models.map(m => `<option ${m === currentChat.model ? "selected" : ""}>${esc(m)}</option>`).join("");
  $("chat-persona").innerHTML =
    `<option value="" ${currentChat.persona_id ? "" : "selected"}>(custom prompt)</option>` +
    personas.map(p => `<option value="${p.id}" ${p.id === currentChat.persona_id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  $("chat-think").checked = currentChat.think;
  $("chat-sysprompt").value = currentChat.system_prompt;
}

async function patchChat(fields) {
  const updated = await api(`/api/chats/${currentChat.id}`, { method: "PATCH", body: JSON.stringify(fields) });
  if (updated.error) { alert(updated.error); return; }
  Object.assign(currentChat, updated);
  syncHeader();
  loadChats();
}

async function openChat(id) {
  currentChat = await api(`/api/chats/${id}`);
  $("setup").classList.add("hidden");
  $("chat-view").classList.remove("hidden");
  syncHeader();
  $("messages").innerHTML = "";
  for (const m of currentChat.messages) renderMessage(m.role, m.content, m.thinking);
  $("messages").scrollTop = $("messages").scrollHeight;
  loadChats();
  $("input").focus();
}

let aborter = null;

async function send() {
  if (streaming) { aborter?.abort(); return; } // Stop button
  const text = $("input").value.trim();
  if (!text || !currentChat) return;
  $("input").value = "";
  streaming = true; $("send").textContent = "Stop";
  aborter = new AbortController();
  renderMessage("user", text);

  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `<div class="who">assistant</div>
    <details class="think" open><summary>thinking</summary><div class="tbody"></div></details>
    <div class="bubble"></div>`;
  $("messages").appendChild(div);
  const thinkEl = div.querySelector(".tbody"), bubbleEl = div.querySelector(".bubble"), details = div.querySelector("details");
  let sawThink = false, sawText = false;

  try {
    const r = await fetch(`/api/chats/${currentChat.id}/messages`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ content: text }),
      signal: aborter.signal,
    });
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const evt = JSON.parse(line);
        if (evt.t === "think") { sawThink = true; thinkEl.textContent += evt.d; }
        if (evt.t === "text") {
          if (!sawText) { sawText = true; details.open = false; }
          bubbleEl.textContent += evt.d;
        }
        if (evt.t === "promote") { // model answered inside <think> — show it as the answer
          bubbleEl.textContent = thinkEl.textContent;
          sawThink = false; sawText = true;
        }
        if (evt.t === "error") { sawText = true; bubbleEl.innerHTML += `<span class="error">${esc(evt.d)}</span>`; }
        if (evt.error) { sawText = true; bubbleEl.innerHTML += `<span class="error">${esc(evt.error)}</span>`; }
      }
      $("messages").scrollTop = $("messages").scrollHeight;
    }
  } catch (e) {
    if (e.name === "AbortError") bubbleEl.innerHTML += `<span class="error"> [stopped]</span>`;
    else bubbleEl.innerHTML += `<span class="error">${esc(e.message)}</span>`;
  }
  if (!sawThink) details.remove();
  if (!bubbleEl.textContent) bubbleEl.innerHTML = `<span class="error">(no response — check the model and try again)</span>`;
  streaming = false; $("send").textContent = "Send"; aborter = null;
  loadChats();
  $("input").focus();
}

$("new-chat").onclick = showSetup;
$("start-chat").onclick = async () => {
  const model = $("model").value;
  if (!model) { $("setup-msg").textContent = "No model available. Pull one in Ollama first."; return; }
  const chat = await api("/api/chats", {
    method: "POST",
    body: JSON.stringify({
      model,
      persona_id: Number($("persona").value) || null,
      system_prompt: $("sysprompt").value.trim(),
      think: $("think").checked,
      mode: $("mode").value,
    }),
  });
  if (chat.error) { $("setup-msg").textContent = chat.error; return; }
  openChat(chat.id);
};
$("save-persona").onclick = async () => {
  const name = $("persona-name").value.trim();
  if (!name) { $("setup-msg").textContent = "Give the persona a name first."; return; }
  const p = await api("/api/personas", {
    method: "POST",
    body: JSON.stringify({ name, system_prompt: $("sysprompt").value.trim() }),
  });
  if (p.error) { $("setup-msg").textContent = p.error; return; }
  $("setup-msg").textContent = "";
  await loadPersonas();
  $("persona").value = p.id;
};
$("delete-persona").onclick = async () => {
  await fetch(`/api/personas/${$("persona").value}`, { method: "DELETE" });
  await loadPersonas();
};
$("chat-model").onchange = () => patchChat({ model: $("chat-model").value });
$("chat-persona").onchange = () => {
  const v = $("chat-persona").value;
  if (v) patchChat({ persona_id: Number(v) });
};
$("chat-think").onchange = () => patchChat({ think: $("chat-think").checked });
$("chat-sys-save").onclick = async () => {
  await patchChat({ system_prompt: $("chat-sysprompt").value.trim(), persona_id: null });
  $("sys-details").open = false;
};
$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

loadPersonas(); loadModels(); loadChats();
</script>
</body>
</html>
