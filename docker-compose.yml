services:
  app:
    build: .
    ports:
      # Bound to localhost only — nginx terminates TLS and proxies here
      - "127.0.0.1:41297:3000"
    environment:
      DATABASE_URL: postgres://ollamachat:ollamachat@postgres:5432/ollamachat
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ollamachat
      POSTGRES_PASSWORD: ollamachat
      POSTGRES_DB: ollamachat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollamachat"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    # Uncomment to expose Ollama on the host:
    # ports:
    #   - "11434:11434"
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
